# Hostinger KVM 2 / VPS — Phase 1 (Asana + hours + import)
# Persistent /data so login and history survive restarts (unlike Vercel /tmp).

services:
  idonea:
    build: .
    container_name: idonea-asana
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      PORT: "4000"
      DATA_DIR: /data
      UPLOAD_DIR: /data/uploads
      SESSION_SECRET: ${SESSION_SECRET:-change-me-on-vps}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NODE_ENV: production
    volumes:
      - idonea_data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Reverse proxy — enable with: docker compose --profile proxy up -d
  nginx:
    profiles: ["proxy"]
    image: nginx:1.27-alpine
    depends_on:
      idonea:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

volumes:
  idonea_data:
